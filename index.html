<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ペット育成ゲーム</title>
</head>

<body>
  <h1>🐣 ペット育成ゲーム</h1>

  <div style="font-size:100px;">🐥</div>

  <p>❤️ なかよし度：<span id="love">50</span></p>
  <p>⚡ 体力：<span id="energy">80</span></p>
  <p>⭐ レベル：<span id="level">1</span></p>

  <button onclick="feed()">🍖 ごはん</button>
  <button onclick="play()">🎾 あそぶ</button>
  <button onclick="sleepPet()">😴 ねる</button>

  <script>
    let love = 50;
    let energy = 80;
    let level = 1;

    function feed() {
      love += 5;
      energy -= 5;
      update();
    }

    function play() {
      if (energy >= 10) {
        love += 10;
        energy -= 10;
        update();
      }
    }

    function sleepPet() {
      energy += 20;

      if (energy > 100) {
        energy = 100;
      }

      update();
    }

    function update() {
      document.getElementById("love").textContent = love;
      document.getElementById("energy").textContent = energy;
      document.getElementById("level").textContent = level;
    }
  </script>
</body>
</html>
